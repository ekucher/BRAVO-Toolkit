name: CI

# AUD-001 (аудит P0.1): обов'язковий CI gate. Раніше "self-test PASSED"
# у PR-описі був лише твердженням автора — GitHub це ніяк не підтверджував
# незалежно. Проєкт цільово Windows PowerShell 5.1 (не PowerShell 7/pwsh —
# у цій репозиторії вже траплялись реальні поведінкові розбіжності між
# 5.1 і 7, наприклад .Count на String), тому раннер — windows-latest, а
# кроки виконуються через `shell: powershell` (вбудований alias на
# Windows PowerShell 5.1 у GitHub Actions), а не `pwsh`.

on:
  push:
    branches: [master, developer]
  pull_request: {}
  workflow_dispatch:

# Мінімальні права за замовчуванням: жоден крок не пише в репозиторій
# (checkout, upload-artifact і gitleaks потребують лише читання;
# upload-artifact іде через окремий runtime-токен, не GITHUB_TOKEN).
# secret-scan нижче розширює права на рівні задачі.
permissions:
  contents: read

# Застарілі прогони PR скасовуються новим пушем у ту саму гілку (кожен
# повний прогін ~19 хв). Скасування ЛИШЕ для pull_request: push у
# developer/master і workflow_dispatch ніколи не скасовуються, щоб не
# губити результат на інтеграційних гілках. Для не-PR подій ключ групи —
# run_id (кожен прогін у власній групі): спільна група за ref навіть із
# cancel-in-progress=false скасовувала б ОЧІКУВАНИЙ push-прогін під час
# серії мержів у developer (GitHub тримає в групі один активний і один
# очікуваний прогін), а telegram-ci-summary трактує cancelled як failed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Check names are split by event on purpose (5.1.0 promotion incident,
# 2026-08-20): master branch protection matches required checks by NAME,
# and during a stable promotion the same head SHA carries BOTH a green
# pull_request run and an intentionally red push run (stable version on
# developer fails the release-policy gate in branch context - documented
# transient). GitHub counted both and blocked the merge ("2 of 5
# required status checks are failing"), forcing an enforce_admins
# bypass. Therefore: pull_request runs keep the canonical names that
# branch protection requires; push/workflow_dispatch runs get a
# " (push)" suffix so they stay visible but never compete with the
# merge gate. If developer ever gets its own required checks, configure
# them with the canonical (pull_request) names.
jobs:
  static-checks:
    name: ${{ github.event_name == 'pull_request' && 'Parser / BOM / JSON' || 'Parser / BOM / JSON (push)' }}
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ОБОВ'ЯЗКОВИЙ. ci\Test-BRAVOReleasePolicy.ps1 звіряє провенанс:
          # VERSION.json у коміті sourceCommit має нести ту саму
          # packageVersion. При shallow-checkout цей коміт недосяжний, і
          # перевірка мовчки вимкнулась би — тобто гейт лишився б у
          # workflow, але перестав би щось охороняти. Guard
          # Governance/ReleasePolicyJobFetchesFullHistory тримає цю опцію
          # на місці.
          fetch-depth: 0

      - name: PowerShell parser (усі .ps1/.psm1/.psd1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in @('.ps1', '.psm1', '.psd1') }
          $failed = $false
          foreach ($file in $files) {
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$parseErrors)
              if ($parseErrors.Count -gt 0) {
                  Write-Host "::error file=$($file.FullName)::$(($parseErrors | ForEach-Object { $_.Message }) -join ' | ')"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

      - name: UTF-8 BOM (обов'язковий для .ps1/.psm1/.psd1 з кирилицею)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in @('.ps1', '.psm1', '.psd1') }
          $failed = $false
          foreach ($file in $files) {
              $bytes = [IO.File]::ReadAllBytes($file.FullName)
              $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
              if (-not $hasBom) {
                  Write-Host "::error file=$($file.FullName)::Missing UTF-8 BOM"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

      - name: JSON коректний (VERSION.json, TOOLS_INTEGRITY.json тощо)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          $jsonFiles = Get-ChildItem -Recurse -File -Filter '*.json' |
              Where-Object { $_.FullName -notmatch '\\LOGS\\' }
          foreach ($file in $jsonFiles) {
              try {
                  [void](Get-Content -LiteralPath $file.FullName -Raw -Encoding UTF8 | ConvertFrom-Json -ErrorAction Stop)
              } catch {
                  Write-Host "::error file=$($file.FullName)::Invalid JSON: $($_.Exception.Message)"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

      # Forbidden patterns PSScriptAnalyzer cannot catch inside strings.
      # Implemented as a repository script, not inline: GitHub Actions
      # writes `run:` blocks to a temp .ps1 WITHOUT a BOM, and Windows
      # PowerShell 5.1 then reads them in the system ANSI code page --
      # any Cyrillic letter whose second UTF-8 byte lands in 0x80-0x9F
      # (e.g. D1 8F) decodes to a control character and breaks parsing.
      # Keep every `run:` block in this workflow ASCII-only.
      - name: Forbidden patterns
        shell: powershell
        run: .\ci\Test-BRAVOForbiddenPattern.ps1

      # RELEASE_POLICY.md: branch <-> packageVersion <-> releaseChannel.
      # AUD-016 moved the channel out of VERSION.json because manual
      # per-branch synchronisation failed twice on a fast-forward merge.
      # The policy puts the channel back into the package (a deployed kit
      # has no .git at all) and replaces that human step with this gate:
      # a stable version on developer, or a -dev/-rc version on master,
      # now fails CI instead of reaching a server unnoticed.
      #
      # Same ASCII-only reason as the step above: keep `run:` ASCII.
      - name: Release policy (branch / version / channel)
        shell: powershell
        run: .\ci\Test-BRAVOReleasePolicy.ps1

      # RELEASE_POLICY.md SS2.2/SS12: master accepts code only via stable
      # promotion from developer or a documented hotfix/* branch, never a
      # direct feature PR -- nothing technical enforced this before (a
      # feature branch merged straight into master, unversioned, is exactly
      # how a notification-routing regression reached production untested).
      # Same ASCII-only reason as the steps above: keep `run:` ASCII.
      - name: Master merge policy (source branch / version bump)
        shell: powershell
        run: .\ci\Test-BRAVOMasterMergePolicy.ps1

      # Integrity manifests must stay in sync with what they describe.
      # A stale manifest would make a freshly deployed kit block itself
      # on the very first run, so this is a build failure, not a warning.
      - name: Integrity manifests are current
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\ci\Update-BRAVOToolsManifest.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\ci\Update-BRAVORuntimeManifest.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\BRAVO_RUNTIME_GUARD.ps1
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::RUNTIME_MANIFEST.json is out of date - run ci\Update-BRAVORuntimeManifest.ps1 -Apply"
              # Typical cause: LF-only working-tree file vs eol=crlf. Show the diagnostics.
              git ls-files --eol -- '*.ps1' '*.psm1' '*.psd1' 'VERSION.json' 'Tools/TOOLS_MANIFEST.json' | Where-Object { $_ -match 'w/(lf|mixed)' }
              exit 1
          }

      - name: Markdown-документи не мають BOM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          $mdFiles = Get-ChildItem -Recurse -File -Filter '*.md'
          foreach ($file in $mdFiles) {
              $bytes = [IO.File]::ReadAllBytes($file.FullName)
              $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
              if ($hasBom) {
                  Write-Host "::error file=$($file.FullName)::Markdown files must not have a BOM (repository convention)"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

      # Агентна політика та маршрутизація моделей — блокуючі перевірки.
      # Check-AgentPolicy.ps1 охороняє канонічну поверхню політики (включно з
      # межами fallback і узгодженістю .claude/ai-routing.json з файлами
      # агентів), Test-AIRouting.ps1 — фактичну поведінку PreToolUse-хука
      # .claude/hooks/validate-agent-routing.ps1 через реальні exit-коди.
      - name: Agent policy / AI routing matrix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -File .\Tools\Check-AgentPolicy.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: AI routing hook tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -File .\.claude\hooks\tests\Test-AIRouting.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Anthropic API Agent Pool (Tools/ApiPool) — офлайн-тести без мережі й реальних
      # секретів: fake transport, sandbox-каталоги, затінені мережеві cmdlet-и.
      - name: API pool offline tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -File .\Tools\ApiPool\tests\Invoke-ApiPoolTests.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Ненав'язливе попередження про можливий дрейф документації. Навмисно
      # НЕ блокуюче: правило евристичне, і блокуючий варіант першого ж дня
      # породив би фіктивні записи в CHANGELOG.md заради зеленого CI.
      # Рішення, чи потрібен запис, лишається за людиною або агентом
      # documentation.
      - name: Документація — попередження про дрейф (не блокує)
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $baseRef = "origin/${{ github.base_ref }}"
          $changed = & git diff --name-only "$baseRef...HEAD" 2>$null
          if ($LASTEXITCODE -ne 0 -or $null -eq $changed) {
              Write-Host "::notice::Could not list changed files against $baseRef - documentation drift check skipped."
              exit 0
          }
          $observable = @($changed | Where-Object {
              $_ -like 'modules/BRAVO.Configuration/*' -or
              $_ -like 'modules/BRAVO.ExitCodes/*' -or
              $_ -like 'BRAVO_*.ps1' -or
              $_ -like 'deploy/*'
          })
          $changelogTouched = @($changed | Where-Object { $_ -ceq 'CHANGELOG.md' }).Count -gt 0
          if ($observable.Count -gt 0 -and -not $changelogTouched) {
              Write-Host "::warning::Files with a potentially observable effect changed ($($observable -join ', ')) but CHANGELOG.md was not touched in this PR. Dispatch the documentation agent, or confirm that no entry is needed."
          }
          exit 0

  psscriptanalyzer:
    name: ${{ github.event_name == 'pull_request' && 'PSScriptAnalyzer' || 'PSScriptAnalyzer (push)' }}
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -SkipPublisherCheck -Repository PSGallery

      # Pass 1 (BLOCKING): exactly the security rule set declared in
      # PSScriptAnalyzerSettings.psd1. None of them is excluded globally
      # -- every justified site carries a targeted SuppressMessage
      # attribute, so any NEW occurrence fails CI.
      #
      # Implemented as a repository script for the encoding reason
      # documented above the "Forbidden patterns" step: keep every
      # `run:` block in this workflow ASCII-only.
      - name: PSScriptAnalyzer - security (blocking)
        shell: powershell
        run: .\ci\Invoke-BRAVOSecurityAnalysis.ps1

      # Pass 2 (INFORMATIONAL): everything else -- style that
      # deliberately contradicts this repository's established
      # architecture (Write-Host for helper script consoles, $global: as
      # the BRAVO.config-to-runtime contract). Never blocks.
      - name: PSScriptAnalyzer - remaining rules (informational)
        shell: powershell
        continue-on-error: true
        run: .\ci\Invoke-BRAVOSecurityAnalysis.ps1 -Informational

  self-test:
    name: ${{ github.event_name == 'pull_request' && 'BRAVO_SELF_TEST.ps1' || 'BRAVO_SELF_TEST.ps1 (push)' }}
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Запуск повного self-test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\BRAVO_SELF_TEST.ps1 -NoPause
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::BRAVO_SELF_TEST.ps1 exited with code $LASTEXITCODE"
              exit 1
          }

      # always(): лог (з таймінгами етапів) потрібен і для зеленого
      # прогону - це єдине джерело тренду тривалості self-test.
      - name: Лог self-test (артефакт завжди)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-test-log
          path: LOGS/HELPERS/BRAVO_SELF_TEST_*.log
          if-no-files-found: ignore

  datarestore-matrix-test:
    name: ${{ github.event_name == 'pull_request' && 'BRAVO_DATA_RESTORE_MATRIX_TEST.ps1' || 'BRAVO_DATA_RESTORE_MATRIX_TEST.ps1 (push)' }}
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # BRAVO_ARCHIV.ps1 (used by the matrix test to produce genuine
      # fixture generations) unconditionally requires an ArchivePassword
      # Credential Manager entry whenever any Archive component is
      # enabled. The value is never read back or verified against
      # anything real -- it only protects a throwaway sandbox archive
      # that this job deletes at the end of its own run -- so a fresh
      # random value generated in-job is fine; no repository secret is
      # involved.
      - name: Provision throwaway 7z credential
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $randomPassword = [guid]::NewGuid().ToString('N')
          cmdkey /generic:BRAVO_7Z_PASSWORD /user:BRAVO_7Z_PASSWORD /pass:$randomPassword
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::cmdkey failed to provision BRAVO_7Z_PASSWORD"
              exit 1
          }

      - name: Запуск матричного E2E-тесту DataRestore
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\BRAVO_DATA_RESTORE_MATRIX_TEST.ps1
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::BRAVO_DATA_RESTORE_MATRIX_TEST.ps1 exited with code $LASTEXITCODE"
              exit 1
          }

      - name: Логи комбінацій (артефакт при падінні)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datarestore-matrix-test-log
          path: LOGS/DataRestoreMatrixTest/*.log
          if-no-files-found: ignore

  secret-scan:
    name: ${{ github.event_name == 'pull_request' && 'Secret scanning (gitleaks)' || 'Secret scanning (gitleaks) (push)' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # gitleaks-action на pull_request-подіях звертається до GitHub API за
    # списком комітів PR (GET /pulls/{n}/commits) — без явного дозволу
    # pull-requests: read це падає 403 "Resource not accessible by
    # integration", хоча той самий workflow на push-подіях (де цей
    # виклик не потрібен) проходив без помилок.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # На workflow_dispatch gitleaks-action не має діапазону комітів із
      # події і запускає `gitleaks detect` без --log-opts, тобто
      # `git log --all`: сканується історія КОЖНОЇ гілки репозиторію, яку
      # checkout з fetch-depth: 0 приніс як refs/remotes/origin/*. Тоді
      # будь-який ручний прогін на будь-якій гілці падав (leaks found: 17)
      # через фікстури в чужих покинутих гілках (закриті PR, у developer
      # і master їх немає), а сама перевірена гілка була чистою.
      # Видаляємо лише локальні remote-tracking refs раннера (репозиторій
      # на GitHub не змінюється): лишаються запущена гілка (refs/heads) з
      # повною історією і всі теги. Повнота скану перевіреного коду не
      # зменшується; кожна інша гілка сканується власним PR/push-прогоном.
      # На pull_request і push крок не виконується - там action і так
      # сканує лише коміти події.
      - name: Обмежити повний скан запущеною гілкою (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git for-each-ref --format='%(refname)' refs/remotes/ | while read -r ref; do
            git update-ref --no-deref -d "$ref"
          done
          echo "Scan scope: HEAD $(git rev-parse HEAD), refs left:"
          git for-each-ref --format='%(refname)' refs/heads/ refs/tags/ | wc -l
          test -z "$(git for-each-ref refs/remotes/)"

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Дефолтна версія action (8.24.3) не знає глобальних [[allowlists]]
          # (введені в gitleaks v8.25.0) і мовчки ігнорує їх у .gitleaks.toml —
          # разом із manifest-allowlist. Пін явної новішої версії.
          GITLEAKS_VERSION: "8.30.1"
