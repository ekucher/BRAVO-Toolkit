name: DEV-LIMS self-test

# Ручний прогін повного BRAVO_SELF_TEST.ps1 на self-hosted раннері DEV-LIMS
# (Windows PowerShell 5.1 на реальному цільовому хості, а не windows-latest).
#
# Безпека (репозиторій ПУБЛІЧНИЙ):
# - Лише workflow_dispatch. Жодних pull_request / push тригерів: код із
#   форків ніколи не потрапляє на DEV-LIMS, а запустити прогін може лише
#   користувач із правом write.
# - permissions: contents: read - токен задачі не може нічого змінити.
# - Лог прогону НЕ вивантажується артефактом: він лишається на хості
#   (LOGS\HELPERS у робочій теці раннера). Консольний вивід задачі у
#   публічному репозиторії бачать усі, тому сюди не можна додавати кроки,
#   що друкують конфігурацію, секрети чи внутрішні шляхи хоста.
# - Не змінює -Suite: прогін завжди повний канонічний.
#
# - Запуск дозволено лише власнику репозиторію (github.actor == ekucher):
#   інші користувачі з правом write отримають skipped-задачу.
#
# Раннер обирається за окремою custom-міткою dev-lims (плюс стандартні
# self-hosted, Windows, X64), тож задача ніколи не потрапить на інший
# self-hosted раннер. Без мітки dev-lims на раннері задача чекатиме в черзі.

# Гілку для перевірки задає input ref (наприклад гілка PR). Сам workflow
# при цьому береться з гілки, з якої його запущено (master після bootstrap),
# тому гілкам PR не потрібно містити цей файл. Порожнє значення означає
# ту саму гілку, з якої запущено workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to test (empty = the dispatch ref)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: dev-lims-selftest
  cancel-in-progress: false

jobs:
  self-test:
    name: BRAVO_SELF_TEST.ps1 (DEV-LIMS)
    if: >
      github.repository == 'ekucher/BRAVO-Toolkit' &&
      github.actor == 'ekucher'
    runs-on: [self-hosted, Windows, X64, dev-lims]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          clean: true

      - name: Tested commit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host ("Tested commit: " + $sha)

      - name: Host info (PowerShell version only)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host ("PowerShell " + $PSVersionTable.PSVersion.ToString() + " / " + $PSVersionTable.PSEdition)

      - name: Full self-test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\BRAVO_SELF_TEST.ps1 -NoPause
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::BRAVO_SELF_TEST.ps1 exited with code $LASTEXITCODE"
              exit 1
          }
