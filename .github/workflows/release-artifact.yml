name: Release artifact

# P1.2 (ROADMAP.md): stable release artifact. Раніше "release package" —
# це був ручний git archive з робочої копії (востаннє для v5.0.2 його
# збирали вручну). Цей workflow збирає той самий детермінований комплект
# автоматично з конкретного release-тега:
#
#     BRAVO-Toolkit-X.Y.Z.zip
#     BRAVO-Toolkit-X.Y.Z.zip.sha256
#     release-manifest.json
#
# і прикріплює його до GitHub Release ЛИШЕ після того, як розпакований
# комплект пройшов обидва integrity-манифести, BRAVO_RUNTIME_GUARD і
# повний BRAVO_SELF_TEST. Якщо Release для тега ще не існує, створюється
# DRAFT — публікація Release лишається рішенням людини (RELEASE_POLICY.md:
# acceptance-вердикт не є авторизацією публікації).
#
# Той самий раннер/шелл-профіль, що й у ci.yml: windows-latest +
# `shell: powershell` (Windows PowerShell 5.1), `run:`-блоки ASCII-only
# (причина задокументована в ci.yml біля кроку "Forbidden patterns").

on:
  push:
    tags: ['v*']
  # Ручний прогін на будь-якому ref: збирає і валідує артефакт, але НЕ
  # прикріплює його до Release (крок upload умовний на ref_type == tag).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-artifact:
    name: Build + validate + attach
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ОБОВ'ЯЗКОВИЙ. ci\New-BRAVOReleaseArtifact.ps1 звіряє, що
          # sourceCommit описує саме спаковане дерево: між ним і комітом
          # архіву мають відрізнятися лише VERSION.json і
          # RUNTIME_MANIFEST.json. sourceCommit — це БАТЬКО коміта-штампа
          # (на тег вішається саме штамп), тому при shallow-checkout його
          # в репозиторії немає і звірку неможливо виконати.
          fetch-depth: 0

      - name: Збирання артефакту (git archive + інтегріті-перевірки)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              .\ci\New-BRAVOReleaseArtifact.ps1 -Ref $env:GITHUB_REF_NAME -ExpectedTag $env:GITHUB_REF_NAME
          } else {
              .\ci\New-BRAVOReleaseArtifact.ps1 -Ref $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Повний self-test з розпакованого артефакту
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location artifacts\release\staging
          try {
              .\BRAVO_SELF_TEST.ps1 -NoPause
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "::error::BRAVO_SELF_TEST.ps1 (artifact staging) exited with code $LASTEXITCODE"
                  exit 1
              }
          } finally {
              Pop-Location
          }

      - name: Артефакти workflow (zip + sha256 + manifest)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact
          path: |
            artifacts/release/*.zip
            artifacts/release/*.zip.sha256
            artifacts/release/release-manifest.json
          if-no-files-found: error

      - name: Прикріплення до GitHub Release (лише для тега)
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $files = @(
              (Get-ChildItem artifacts\release -Filter '*.zip').FullName,
              (Get-ChildItem artifacts\release -Filter '*.zip.sha256').FullName,
              (Join-Path (Resolve-Path artifacts\release) 'release-manifest.json')
          )
          # RELEASE_POLICY.md section 16: development and RC releases must be
          # marked as pre-release; only a stable release may be Latest. Without
          # --prerelease every RC draft was created as an ordinary release, so
          # publishing it made an unaccepted candidate the Latest release that
          # operators see first (observed on the v5.2.0-rc.1 draft).
          # GitHub excludes pre-releases from Latest on its own, so the single
          # flag is enough - no --latest=false, which older gh versions reject.
          $isPrerelease = $tag -match '-(dev|rc)\.'
          # isDraft is CAPTURED, not just probed for existence: it decides
          # whether replacing assets is allowed at all (issue #151). Previously
          # the value was printed and discarded, and --clobber ran for draft and
          # published releases alike - a re-run on a published tag silently
          # replaced the bytes operators had already downloaded.
          # -join: gh returns the JSON as a string ARRAY when it spans lines,
          # and Windows PowerShell 5.1 ConvertFrom-Json chokes on an array
          # ("Invalid JSON primitive"). $LASTEXITCODE still reflects gh itself.
          $viewJson = (gh release view $tag --json isDraft,assets) -join "`n"
          if ($LASTEXITCODE -eq 0) {
              $release = $viewJson | ConvertFrom-Json
              if ($isPrerelease) {
                  # The release may predate this fix (or have been created by
                  # hand), so the flag is enforced instead of assumed.
                  #
                  # This runs BEFORE the upload on purpose: a release created by
                  # an earlier run already carries these three assets, so the
                  # upload is the step most likely to fail here. Setting the
                  # policy flag first keeps the repair path working regardless.
                  gh release edit $tag --prerelease
                  if ($LASTEXITCODE -ne 0) { exit 1 }
              }

              if ([bool]$release.isDraft) {
                  # DRAFT: nothing has been handed to operators yet, so the
                  # repair path stays as it was.
                  # --clobber: on any re-run the assets already exist under the
                  # same names and plain upload aborts. Replacing them is safe
                  # because this step is reached only after the artifact passed
                  # both integrity manifests, BRAVO_RUNTIME_GUARD and the full
                  # self-test.
                  gh release upload $tag --clobber @files
                  if ($LASTEXITCODE -ne 0) { exit 1 }
              } else {
                  # PUBLISHED: one tag - one immutable set of artifacts.
                  #   same SHA-256  -> no-op, success (re-run stays idempotent)
                  #   different     -> FAIL, nothing is replaced
                  # The published asset is downloaded and hashed rather than
                  # trusting the .sha256 sidecar: the sidecar is itself an asset
                  # and would be replaced by the same run it is meant to guard.
                  $publishedAssetNames = @($release.assets | ForEach-Object { [string]$_.name })
                  $verifyRoot = Join-Path ([IO.Path]::GetTempPath()) ('bravo-release-verify-' + [guid]::NewGuid().ToString('N'))
                  New-Item -ItemType Directory -Path $verifyRoot -Force | Out-Null
                  try {
                      $absentAssets = New-Object System.Collections.Generic.List[string]
                      $mismatchedAssets = New-Object System.Collections.Generic.List[string]
                      foreach ($file in $files) {
                          $assetName = Split-Path -Leaf $file
                          if ($publishedAssetNames -notcontains $assetName) {
                              [void]$absentAssets.Add($file)
                              continue
                          }
                          gh release download $tag --pattern $assetName --dir $verifyRoot
                          if ($LASTEXITCODE -ne 0) {
                              Write-Host "::error::RELEASE_ASSET_IMMUTABILITY: не вдалося завантажити опублікований ассет '$assetName' тега '$tag' для звірки SHA-256"
                              exit 1
                          }
                          $publishedHash = (Get-FileHash -LiteralPath (Join-Path $verifyRoot $assetName) -Algorithm SHA256).Hash.ToUpperInvariant()
                          $builtHash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToUpperInvariant()
                          if ($publishedHash -ne $builtHash) {
                              [void]$mismatchedAssets.Add("$assetName (опубліковано $publishedHash, зібрано $builtHash)")
                          }
                      }

                      if ($mismatchedAssets.Count -gt 0) {
                          Write-Host "::error::RELEASE_ASSET_IMMUTABILITY: тег '$tag' уже опублікований, а перезбірка дала ІНШІ байти: $($mismatchedAssets -join '; '). Опублікований артефакт не замінюється. Якщо зміна навмисна - випустіть новий тег."
                          exit 1
                      }

                      if ($absentAssets.Count -gt 0) {
                          # Adding a MISSING asset replaces nothing, so it stays
                          # allowed: it repairs a publish that uploaded only part
                          # of the set. Plain upload without --clobber - if the
                          # name turns out to exist after all, the command fails
                          # instead of overwriting.
                          $absentArgs = $absentAssets.ToArray()
                          Write-Host "RELEASE_ASSET_IMMUTABILITY: тег '$tag' опублікований; доливаються лише ВІДСУТНІ ассети: $(($absentArgs | ForEach-Object { Split-Path -Leaf $_ }) -join ', ')"
                          gh release upload $tag @absentArgs
                          if ($LASTEXITCODE -ne 0) { exit 1 }
                      } else {
                          Write-Host "RELEASE_ASSET_IMMUTABILITY: усі ассети опублікованого тега '$tag' збігаються за SHA-256 - заміна не потрібна (no-op)."
                      }
                  } finally {
                      Remove-Item -LiteralPath $verifyRoot -Recurse -Force -ErrorAction SilentlyContinue
                  }
              }
          } else {
              $createArgs = @(
                  '--draft',
                  '--title', "BRAVO Toolkit $($tag.TrimStart('v'))",
                  '--notes', 'Automated draft: validated release artifact attached by the release-artifact workflow. Review and publish manually.'
              )
              if ($isPrerelease) { $createArgs += '--prerelease' }
              gh release create $tag @createArgs @files
              if ($LASTEXITCODE -ne 0) { exit 1 }
          }
